{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>Delete Petition</h1>
    <p>Are you sure you want to delete "{{ petition.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'petition:index' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
