{%extends 'base.html'%}
{%block content%}

<div class="container mt-4">
<h2>Create Petition</h2>
<div class="card p-3">
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
        {{ form.title.label_tag }}
        {{ form.title }}
        </div>
        <div class="mb-3">
        {{ form.description.label_tag }}
        {{ form.description }}
        </div>
        <button class="btn btn-primary" type="submit">Create</button>
    </form>
</div>
</div>
{%endblock%}
