{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <h3 class="mb-4">Top Reviews by Likes</h3>
      <ul class="list-group">
        {% for review in top_reviews %}
          <li class="list-group-item d-flex justify-content-between align-items-center">
            <span>
              <strong>{{ review.user.username }}</strong>: {{ review.comment }}
            </span>
            <span>
              <span class="badge bg-primary rounded-pill me-2">{{ review.likes }} likes</span>
              <form method="post" action="{% url 'top_review.like_review' review.id %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-outline-success">Like</button>
              </form>
            </span>
          </li>
        {% empty %}
          <li class="list-group-item">No reviews yet.</li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>
{% endblock content %}
